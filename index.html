<style>
:root{--dm:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#11111a;color:#ededf3;font:400 15px/1.5 var(--dm);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;display:grid;place-items:center;padding:16px}
input{-webkit-user-select:text;user-select:text}
.ic{width:18px;height:18px;stroke-width:1.7;flex:none}
.shell{width:min(1080px,100%);min-height:min(620px,calc(100vh - 32px));border-radius:24px;background:#171721;border:1px solid #2d2d3d;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;padding:52px;align-items:center;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 40px 120px rgba(0,0,0,.45)}
.shell::before{content:"";position:absolute;inset:-10%;z-index:-1;background:radial-gradient(40% 45% at 75% 40%,rgba(228,126,26,.22),transparent 70%),radial-gradient(35% 40% at 10% 90%,rgba(82,102,235,.2),transparent 70%)}
.logo{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:590;color:#ededf3}
.logo img{height:40px;width:auto;display:block}
.logo span{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#9a9ab3;padding-left:12px;border-left:1px solid #2d2d3d}
.by{display:flex;align-items:center;gap:12px;margin-top:22px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7b7b95}
.by img{height:20px;width:auto;display:block}
h1{font:480 clamp(40px,5vw,64px)/1.02 var(--dm);letter-spacing:-.035em;color:#ededf3;margin:26px 0 18px;max-width:12ch}
h1 em{font-style:italic;color:#e47e1a}
.sub{color:#9a9ab3;font-size:16px;max-width:38ch;margin:0}
.lock{display:inline-flex;align-items:center;gap:10px;margin-top:28px;font:500 12px/1.4 var(--mono);color:#9a9ab3;border:1px solid #2d2d3d;border-radius:40px;padding:9px 14px}
.lock .ic{width:15px;height:15px;color:#e47e1a}
form{background:#1e1e2a;border:1px solid #2d2d3d;border-radius:16px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
form h2{font:590 20px/1.2 var(--dm);margin:0 0 4px;color:#fff;letter-spacing:-.01em}
form p{margin:0 0 22px;font-size:13.5px;color:#9a9ab3}
label{display:block;font:500 11.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#9a9ab3;margin:16px 0 8px}
.field{display:flex;align-items:center;gap:10px;border-radius:12px;background:#171721;border:1px solid #2d2d3d;padding:0 8px 0 14px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:#e47e1a;box-shadow:0 0 0 4px rgba(228,126,26,.15)}
.field .ic{color:#7b7b95;width:16px;height:16px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:15px;padding:12px 0;outline:none}
.eye{border:0;background:transparent;color:#9a9a9a;cursor:pointer;display:grid;place-items:center;width:34px;height:34px;border-radius:9999px}
.eye:hover{color:#fff}
.go{margin-top:24px;width:100%;display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:9999px;background:#e47e1a;color:#10101a;font:590 15px var(--dm);padding:13px 18px;cursor:pointer;transition:filter .2s,transform .2s}
.go:hover{filter:brightness(1.06);transform:translateY(-1px)}
.go[disabled]{opacity:.6;cursor:progress}
.go .ic{width:16px;height:16px}
.err{min-height:20px;margin-top:12px;font:12.5px/1.5 var(--mono);color:#ffb59a}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.foot{position:fixed;bottom:12px;left:0;right:0;text-align:center;font:11.5px var(--mono);color:#5f5f5f}
@media (max-width:820px){.shell{grid-template-columns:1fr;padding:32px 22px;border-radius:28px}h1{font-size:40px}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

<script>
(() => {
  'use strict';
  // Right-click and drag are disabled on this page.
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());
  const E = JSON.parse(document.getElementById('enc').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const salt = b64(E.salt), iv = b64(E.iv), ct = b64(E.ct);
  const err = document.getElementById('err'), go = document.getElementById('go'), f = document.getElementById('f');
  if (!(window.crypto && crypto.subtle)) { err.textContent = 'This browser cannot decrypt the page. Please use a current version of Chrome, Edge, Safari or Firefox.'; go.disabled = true; return; }
  async function open(key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }
  async function derive(u, p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(u.trim().toLowerCase() + '\n' + p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  // The key is never persisted (github.io origins are shared across repos); clear any key an older build stored.
  try { sessionStorage.removeItem('rinse-k'); } catch (e) {}
  document.getElementById('eye').onclick = () => { const p = document.getElementById('p'); p.type = p.type === 'password' ? 'text' : 'password'; };
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const u = document.getElementById('u').value, p = document.getElementById('p').value;
    if (!u || !p) { err.textContent = 'Enter your username and password.'; return; }
    go.disabled = true; go.firstChild.textContent = 'Decrypting… ';
    try {
      await open(await derive(u, p));
    } catch (x) {
      go.disabled = false; go.firstChild.textContent = 'Sign in ';
      err.textContent = 'Incorrect username or password.';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
    }
  });
})();
</script>
